name: Zero-Egress Offline Compliance
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Execute Offline Test Suite
        run: node tests/egress-offline.test.js
